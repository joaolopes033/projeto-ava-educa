<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno | AVA-EDUCA+</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="cadastro-aluno.css">
</head>
<body>
    <header id="cabecalho" class="cabecalho"></header>

    <div class="estrutura">
        <nav id="menu" class="menu"></nav>

        <main class="conteudo">
            <h1>Cadastro de aluno</h1>

            <form>
                <fieldset>
                    <legend>Dados pessoais</legend>

                    <div class="linha">
                        <div class="campo campo-grande">
                            <label for="nome">Nome completo *</label>
                            <input type="text" id="nome" maxlength="80">
                            <small id="erro-nome" class="erro-campo"></small>
                        </div>

                        <div class="campo">
                            <label for="genero">Gênero *</label>
                            <select id="genero">
                                <option value="">Selecione</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Feminino">Feminino</option>
                                <option value="Outro">Outro</option>
                                <option value="Prefiro não informar">Prefiro não informar</option>
                            </select>
                            <small id="erro-genero" class="erro-campo"></small>
                        </div>
                    </div>

                    <div class="linha">
                        <div class="campo">
                            <label for="dataNascimento">Data de nascimento *</label>
                            <input type="text" id="dataNascimento" maxlength="10" placeholder="DD/MM/YYYY">
                            <small id="erro-dataNascimento" class="erro-campo"></small>
                        </div>

                        <div class="campo">
                            <label for="cpf">CPF * (somente números)</label>
                            <input type="text" id="cpf" maxlength="11">
                            <small id="erro-cpf" class="erro-campo"></small>
                        </div>

                        <div class="campo">
                            <label for="telefone">Telefone * (somente números)</label>
                            <input type="text" id="telefone" maxlength="11">
                            <small id="erro-telefone" class="erro-campo"></small>
                        </div>
                    </div>

                    <div class="linha">
                        <div class="campo campo-grande">
                            <label for="email">E-mail *</label>
                            <input type="email" id="email">
                            <small id="erro-email" class="erro-campo"></small>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <div class="linha">
                        <div class="campo">
                            <label for="cep">CEP * (somente números)</label>
                            <input type="text" id="cep" maxlength="8">
                            <small id="erro-cep" class="erro-campo"></small>
                        </div>

                        <div class="campo campo-grande">
                            <label for="cidade">Cidade *</label>
                            <input type="text" id="cidade">
                            <small id="erro-cidade" class="erro-campo"></small>
                        </div>

                        <div class="campo">
                            <label for="estado">Estado *</label>
                            <input type="text" id="estado">
                            <small id="erro-estado" class="erro-campo"></small>
                        </div>
                    </div>

                    <div class="linha">
                        <div class="campo campo-grande">
                            <label for="logradouro">Logradouro *</label>
                            <input type="text" id="logradouro">
                            <small id="erro-logradouro" class="erro-campo"></small>
                        </div>

                        <div class="campo">
                            <label for="numero">Número *</label>
                            <input type="text" id="numero">
                            <small id="erro-numero" class="erro-campo"></small>
                        </div>
                    </div>

                    <div class="linha">
                        <div class="campo">
                            <label for="complemento">Complemento</label>
                            <input type="text" id="complemento">
                        </div>

                        <div class="campo">
                            <label for="bairro">Bairro *</label>
                            <input type="text" id="bairro">
                            <small id="erro-bairro" class="erro-campo"></small>
                        </div>
                    </div>
                </fieldset>

                <p id="mensagem-formulario" class="mensagem oculto"></p>

                <button type="button" id="botao-salvar" class="botao-principal">Salvar</button>
            </form>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script type="module" src="cadastro-aluno.js"></script>
</body>
</html>
