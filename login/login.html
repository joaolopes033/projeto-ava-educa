<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AVA-EDUCA+</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="caixa-login">
        <header>
            <h1>AVA-EDUCA+</h1>
            <p>Acesse sua conta</p>
        </header>

        <form>
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email">
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha">
            </div>

            <p id="mensagem-login" class="mensagem mensagem-erro oculto"></p>

            <button type="button" id="botao-entrar" class="botao-principal">Entrar</button>
            <a href="#" id="link-esqueci-senha">Esqueci minha senha</a>
        </form>
    </main>

    <script type="module" src="login.js"></script>
</body>
</html>
